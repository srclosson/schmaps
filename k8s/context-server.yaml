# Temporary in-cluster HTTP server that hosts the Schmaps build context tar.
# Applied by k8s/build.sh, torn down after the build completes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: schmaps-context
  namespace: schmaps
  labels:
    app.kubernetes.io/name: schmaps
    app.kubernetes.io/component: context-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: context-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: schmaps
        app.kubernetes.io/component: context-server
    spec:
      containers:
        - name: server
          image: busybox:latest
          command:
            - sh
            - -c
            - |
              set -e
              mkdir -p /www
              base64 -d /context/context.b64 > /www/context.tar.gz
              echo "Serving context.tar.gz ($(wc -c < /www/context.tar.gz) bytes) on :8080"
              exec httpd -f -p 8080 -h /www
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: context
              mountPath: /context
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: context
          configMap:
            name: schmaps-context-b64
---
apiVersion: v1
kind: Service
metadata:
  name: schmaps-context
  namespace: schmaps
  labels:
    app.kubernetes.io/name: schmaps
    app.kubernetes.io/component: context-server
spec:
  selector:
    app.kubernetes.io/component: context-server
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP