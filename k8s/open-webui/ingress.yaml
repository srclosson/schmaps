apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: open-webui
  namespace: open-webui
  labels:
    app.kubernetes.io/name: open-webui
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/hostname: think-civo.stackgen.run
    external-dns.alpha.kubernetes.io/target: 212.2.243.121
    # Allow large chat payloads / file uploads through the proxy.
    traefik.ingress.kubernetes.io/buffering.maxRequestBodyBytes: "268435456"
spec:
  ingressClassName: traefik
  rules:
    - host: think-civo.stackgen.run
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: open-webui
                port:
                  number: 80
  tls:
    - hosts:
        - think-civo.stackgen.run
      secretName: open-webui-tls