apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: schmaps
  namespace: schmaps
  labels:
    app.kubernetes.io/name: schmaps
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: schmaps
  # 500 users / ~50 concurrent users per pod = 10 pod ceiling.
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
      selectPolicy: Min