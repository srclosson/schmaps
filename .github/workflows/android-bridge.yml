name: android-bridge APK

# Builds the signed Schmaps OBD bridge APK on EVERY push to the repo
# (any code change), plus manual runs. The APK lands in the run's
# Artifacts — download it, sideload it, done.
#
# One-time keystore bootstrap (no local Java needed — the runner has it):
#   1. Run this workflow once with the "Generate keystore" input enabled.
#      It creates a fresh keystore and uploads it as an artifact.
#   2. Download that artifact, then add repo secrets:
#         KEYSTORE_BASE64   = base64 -i schmaps-bridge.jks
#         KEYSTORE_PASSWORD = the password you chose (shown in the run log)
#         KEY_ALIAS         = schmapsbridge
#         KEY_PASSWORD      = same as KEYSTORE_PASSWORD
#   3. Re-run the workflow — from now on every APK is signed with that
#      key, so updates install over the old version without uninstalling.

on:
  push:
  workflow_dispatch:
    inputs:
      generate_keystore:
        description: "Generate a new keystore (first run only)"
        type: boolean
        default: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # (No android-actions/setup-android needed: ubuntu-latest
      #  runners ship the Android SDK preinstalled — and that action
      #  has been failing upstream.)

      # The Gradle wrapper jar isn't committed (no local Java to
      # generate it) — install Gradle on the runner instead.
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Generate keystore (bootstrap)
        if: ${{ inputs.generate_keystore }}
        run: |
          KEYSTORE_PASSWORD=$(openssl rand -base64 18 | tr -d '/+=' | head -c 20)
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Keystore password: $KEYSTORE_PASSWORD (also in the job summary — save it now)"
          keytool -genkeypair -v \
            -keystore schmaps-bridge.jks \
            -storetype JKS \
            -alias schmapsbridge \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=Schmaps Bridge, OU=Schmaps, O=srclos, L=Ottawa, ST=Ontario, C=CA"

      - name: Upload keystore artifact (bootstrap)
        if: ${{ inputs.generate_keystore }}
        uses: actions/upload-artifact@v4
        with:
          name: schmaps-bridge-keystore
          path: schmaps-bridge.jks
          retention-days: 1

      - name: Build signed APK
        if: ${{ !inputs.generate_keystore }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android-bridge
          gradle assembleRelease --no-daemon

      - name: Upload APK
        if: ${{ !inputs.generate_keystore }}
        uses: actions/upload-artifact@v4
        with:
          name: schmaps-bridge-apk
          path: android-bridge/app/build/outputs/apk/release/app-release.apk
          retention-days: 90