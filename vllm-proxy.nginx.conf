# Bearer-token auth in front of vLLM.
#
# vLLM's own --api-key only guards /v1, /v2 and /inference. Per the vLLM
# source: "Other endpoints on the same server, including /invocations
# (which exposes the same inference capabilities as /v1), remain
# unauthenticated. Do not rely on --api-key alone to secure vLLM."
#
# So this proxy enforces the same bearer token on EVERY path, which covers
# /invocations and anything else vLLM exposes. vLLM itself is bound to
# 127.0.0.1 only, so the only way in is through this proxy -> cloudflared.
#
# This file is a TEMPLATE. ${VLLM_API_KEY} is substituted with envsubst(1)
# from /home/stephanie/var/portainer/ai/.env at deploy time; nginx itself does
# not expand it. The rendered copy lives at /etc/nginx/conf.d/vllm-proxy.conf
# with mode 600 so the token is never world-readable and never lives in git.

server {
    listen 127.0.0.1:8080;
    server_name _;

    # Inference responses stream; don't buffer them and don't time out early.
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 0;

    # No request logging by default: prompt bodies can end up in the access log.
    access_log off;
    error_log /var/log/nginx/vllm-proxy.error.log warn;

    location / {
        if ($http_authorization != "Bearer ${VLLM_API_KEY}") {
            return 401 '{"error":{"message":"invalid or missing bearer token","type":"authentication_error"}}';
        }

        proxy_pass http://127.0.0.1:11434;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Streaming completions rely on these not being buffered upstream.
        proxy_set_header Connection "";
        chunked_transfer_encoding on;
    }
}
